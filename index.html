<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정왕고 AI 기초 보조학습</title>
    <style>
        /* --- 기본 & 공통 스타일 --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            box-sizing: border-box; 
            background-color: #f8f8f8; 
            color: #555; 
            font-size: 1.1rem; 
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        .page {
            display: none; 
            padding: 25px; 
            width: 100%;
            min-height: 100vh; 
            animation: fadeIn 0.5s; 
        }

        .page.active {
            display: block; 
        }
        
        #studentPage.active {
            display: flex;
        }

        h1, h2, h3 {
            color: #444; 
            margin-bottom: 20px;
        }
        h1 { font-size: 2.5rem; } 
        h2 { font-size: 2rem; }   
        h3 { font-size: 1.6rem; } 

        button {
            display: inline-block;
            padding: 15px 30px; 
            margin: 12px 6px; 
            font-size: 1.2rem; 
            font-weight: bold;
            color: white;
            background-color: #87ceeb; 
            border: none;
            border-radius: 8px; 
            cursor: pointer;
            transition: background-color 0.3s ease; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }

        button:hover {
            background-color: #6ab5d3; 
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            max-width: 450px; 
            padding: 12px; 
            margin: 12px 0; 
            font-size: 1.1rem; 
            border: 1px solid #cce0eb; 
            border-radius: 8px; 
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); 
        }
        
        .home-button {
            background-color: #b0c4de; 
        }
        .home-button:hover {
            background-color: #9db2cc; 
        }

        /* --- 방문자 수 표시 스타일 --- */
        .visitor-stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #666;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 100;
            border: 1px solid #eef2f5;
        }
        .visitor-stats b {
            color: #87ceeb;
            margin-left: 5px;
            margin-right: 10px;
        }

        /* --- 1. 홈 페이지 스타일 --- */
        #homePage {
            text-align: center;
            padding-top: 120px; 
            position: relative; 
        }
        #homePage h1 {
            font-size: 2.8rem; 
            margin-bottom: 50px;
            color: #333;
            line-height: 1.4;
        }
        #homePage .button-container {
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
        }
        #homePage button {
            width: 85%; 
            max-width: 350px; 
        }
        
        @media (min-width: 600px) {
            #homePage .button-container {
                flex-direction: row; 
            }
             #homePage button {
                width: auto;
                min-width: 200px;
            }
        }

        .creator-signature {
            position: absolute; 
            bottom: 30px;     
            left: 0;
            right: 0;
            font-size: 1rem;    
            color: #aaa;       
        }

        /* --- 2. 교사 페이지 스타일 --- */
        #teacherPage {
            max-width: 90%; 
            margin: 0 auto; 
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        #teacherTools {
            margin-top: 30px; 
            border-top: 2px solid #e0e0e0; 
            padding-top: 25px; 
        }
        #teacherTools label {
            display: block; 
            margin-top: 18px; 
            font-weight: 600; 
            color: #444;
            font-size: 1.15rem; 
        }
        #savedList li {
            padding: 10px 0;
            border-bottom: 1px dashed #e0e0e0;
            font-size: 1rem;
            display: flex;
            flex-wrap: wrap; 
            justify-content: space-between;
            align-items: center;
        }

        /* --- 3. 학습자 페이지 스타일 --- */
        #studentPage {
            padding: 0;
            flex-direction: column; 
            height: 100vh; 
            background-color: #f0f5f8; 
        }
        .student-header {
            padding: 15px 25px; 
            background: #e6f2f7; 
            border-bottom: 1px solid #d4e8f2; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .student-container {
            display: flex;
            flex-direction: column; 
            flex-grow: 1; 
            overflow: hidden; 
            background-color: #fff; 
        }
        .sidebar {
            width: 100%;
            height: 35vh; 
            background: #e6f2f7; 
            border-right: 1px solid #d4e8f2; 
            overflow-y: auto; 
            padding: 15px; 
        }
        .sidebar .unit-title {
            padding: 15px 20px;
            cursor: pointer;
            font-weight: bold;
            color: #444;
            position: relative;
            border-bottom: 1px solid #dbe9f0;
        }
        .sidebar .unit-title::after {
            content: '▼';
            font-size: 0.8rem;
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%) scaleX(1.2);
        }
        .sidebar .topic-sublist {
            list-style: none;
            padding: 0;
            margin: 0;
            display: none;
            background-color: #f7fcff;
        }
        .sidebar .topic-sublist.visible { display: block; }
        .sidebar .topic-item {
            padding: 15px 20px 15px 35px;
            cursor: pointer;
            border-top: 1px solid #eaf3f7;
            font-size: 1.1rem;
        }
        .sidebar .topic-item:hover, .sidebar .topic-item.active {
            background-color: #d0e7f2; 
        }
        .content-area {
            width: 100%;
            height: 65vh; 
            background-color: #fdfdfd;
        }
        .content-area iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (min-width: 768px) {
            .student-container { flex-direction: row; }
            .sidebar { flex-basis: 20%; min-width: 200px; height: auto; }
            .content-area { flex-basis: 80%; height: auto; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="homePage" class="page active">
        <div class="visitor-stats">
            오늘 <b id="todayCount">0</b> 전체 <b id="totalCount">0</b>
        </div>

        <h1>정왕고등학교 1학년 인공지능기초 과목<br>수업을 위한 보조학습 웹페이지입니다.</h1>
        <div class="button-container">
            <button onclick="showTeacherLogin()">👩‍🏫 교사용</button>
            <button onclick="showStudentPage()">👨‍🎓 학습자</button>
        </div>
        
        <div class="creator-signature">
            © 2025 정왕고등학교. All rights reserved.<br>
            Developed by 김관동/한진우
        </div>
    </div>

    <div id="teacherPage" class="page">
        <h2>교사용 페이지</h2>
        <div id="loginSection">
            <label for="passwordInput">비밀번호:</label>
            <input type="password" id="passwordInput" placeholder="비밀번호를 입력하세요" onkeyup="checkEnter(event)">
            <button onclick="login()">로그인</button>
        </div>
        <div id="teacherTools" style="display:none;">
            <h3>학습 주제 추가</h3>
            <label for="unitInput">단원:</label>
            <input type="text" id="unitInput" placeholder="예: 1단원">
            <label for="topicInput">주제:</label>
            <input type="text" id="topicInput" placeholder="예: 프로젝트명">
            <label for="urlInput">사이트 주소:</label>
            <input type="text" id="urlInput" placeholder="https://example.com">
            <button id="saveButton" onclick="saveTopic()">저장하기</button>
            <hr>
            <h3>저장된 목록 (확인용)</h3>
            <ul id="savedList"></ul>
        </div>
        <button class="home-button" onclick="goHome()">🏠 홈으로</button>
    </div>

    <div id="studentPage" class="page">
        <header class="student-header">
            <h3>학습 주제</h3>
            <button class="home-button" onclick="goHome()">🏠 홈으로</button>
        </header>
        <div class="student-container">
            <nav class="sidebar"><ul id="topicList"><li>등록된 주제가 없습니다.</li></ul></nav>
            <main class="content-area"><iframe id="contentFrame" src="about:blank"></iframe></main>
        </div>
    </div>

    <script>
        let teacherPassword = null;
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxxxsvBgBmhYV2Y24TGmPv1yPCdbIaFE_qyzLJVd7vhHf1WSgnpemcAayFBlhp-DH2xxQ/exec";
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR5H6Tgsns5_cRyLmGHsit2NLCK615SdmsDOX2IYQXoW_q6WNT0OoYNzT_ou4LNw0U1ADo-CX9oTs4H/pub?gid=0&single=true&output=csv";

        // 방문자 수 업데이트 함수
        async function updateVisitorStats() {
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'visit' })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    document.getElementById('todayCount').textContent = result.today;
                    document.getElementById('totalCount').textContent = result.total;
                }
            } catch (e) { console.error("방문자 데이터 로드 실패", e); }
        }

        // 페이지 초기 로드
        document.addEventListener('DOMContentLoaded', () => {
            showPage('homePage');
            updateVisitorStats();
        });

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function goHome() { showPage('homePage'); updateVisitorStats(); }

        async function login() {
            const pw = document.getElementById('passwordInput').value;
            const btn = document.querySelector('#loginSection button');
            btn.disabled = true; btn.textContent = '확인 중...';
            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'login', password: pw })
                });
                const result = await res.json();
                if (result.status === 'success') {
                    teacherPassword = pw;
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('teacherTools').style.display = 'block';
                    loadSavedListForTeacher();
                } else { alert('비밀번호가 틀렸습니다.'); }
            } catch (e) { alert('오류 발생'); }
            finally { btn.disabled = false; btn.textContent = '로그인'; }
        }

        async function getTopicsFromSheet() {
            try {
                const res = await fetch(SHEET_CSV_URL + '&_t=' + Date.now());
                const csv = await res.text();
                return csv.trim().split('\n').slice(1).map(line => {
                    const [unit, topic, url] = line.split(',');
                    return { unit: unit?.trim(), topic: topic?.trim(), url: url?.trim() };
                }).filter(i => i.unit && i.topic);
            } catch (e) { return []; }
        }

        async function saveTopic() {
            const unit = document.getElementById('unitInput').value.trim();
            const topic = document.getElementById('topicInput').value.trim();
            let url = document.getElementById('urlInput').value.trim();
            if(!unit || !topic || !url) return alert('모두 입력하세요.');
            if(!url.includes('://')) url = 'https://' + url;

            const btn = document.getElementById('saveButton');
            btn.disabled = true; btn.textContent = '저장 중...';

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ password: teacherPassword, unit, topic, url })
                });
                const result = await res.json();
                if(result.status === 'success') {
                    alert('저장완료');
                    document.getElementById('unitInput').value = '';
                    document.getElementById('topicInput').value = '';
                    document.getElementById('urlInput').value = '';
                    loadSavedListForTeacher();
                }
            } catch(e) { alert('에러'); }
            finally { btn.disabled = false; btn.textContent = '저장하기'; }
        }

        async function loadSavedListForTeacher() {
            const topics = await getTopicsFromSheet();
            const list = document.getElementById('savedList');
            list.innerHTML = topics.map(i => `<li>[${i.unit}] ${i.topic}</li>`).join('');
        }

        async function showStudentPage() {
            showPage('studentPage');
            const topics = await getTopicsFromSheet();
            const list = document.getElementById('topicList');
            list.innerHTML = '';
            
            const grouped = new Map();
            topics.forEach(t => {
                if(!grouped.has(t.unit)) grouped.set(t.unit, []);
                grouped.get(t.unit).push(t);
            });

            grouped.forEach((items, unit) => {
                const li = document.createElement('li');
                li.innerHTML = `<div class="unit-title">${unit}</div>`;
                const sub = document.createElement('ul');
                sub.className = 'topic-sublist';
                items.forEach(item => {
                    const itemLi = document.createElement('li');
                    itemLi.className = 'topic-item';
                    itemLi.textContent = item.topic;
                    itemLi.onclick = () => {
                        document.getElementById('contentFrame').src = item.url;
                        document.querySelectorAll('.topic-item').forEach(el => el.classList.remove('active'));
                        itemLi.classList.add('active');
                    };
                    sub.appendChild(itemLi);
                });
                li.querySelector('.unit-title').onclick = () => {
                    sub.classList.toggle('visible');
                    li.querySelector('.unit-title').classList.toggle('open');
                };
                li.appendChild(sub);
                list.appendChild(li);
            });
        }
        function checkEnter(e) { if(e.key === 'Enter') login(); }
    </script>
</body>
</html>
